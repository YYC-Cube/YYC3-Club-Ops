services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: yyc3_club_ops
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5433}:5432"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      APP_ORIGIN: ${APP_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS}
      SESSION_MAX_LIFETIME_SECONDS: ${SESSION_MAX_LIFETIME_SECONDS}
      TRUST_PROXY: ${TRUST_PROXY}
      LOGIN_IP_WINDOW_SECONDS: ${LOGIN_IP_WINDOW_SECONDS}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT}
      LOGIN_IP_BLOCK_SECONDS: ${LOGIN_IP_BLOCK_SECONDS}
      LOGIN_PHONE_WINDOW_SECONDS: ${LOGIN_PHONE_WINDOW_SECONDS}
      LOGIN_PHONE_LIMIT: ${LOGIN_PHONE_LIMIT}
      LOGIN_PHONE_BLOCK_SECONDS: ${LOGIN_PHONE_BLOCK_SECONDS}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/yyc3_club_ops
      DATABASE_OWNER_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/yyc3_club_ops
      SYNC_CMS_COMMANDS_URL: http://cms:3030/api/v1/sync/commands
      SYNC_TENANT_ID: ${SYNC_TENANT_ID}
      SYNC_STORE_ID: ${SYNC_STORE_ID}
      SYNC_HMAC_ACCESS_KEY: ${SYNC_HMAC_ACCESS_KEY}
      SYNC_HMAC_SECRET: ${SYNC_HMAC_SECRET}
    depends_on:
      - db
    ports:
      - "${API_PORT:-4000}:4000"

  cms:
    build:
      context: ../../YYC3-Clube-Management-System
      dockerfile: deploy/cms.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/yyc3_yy
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: yyc3_yy
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ARTIST_REPORT_DATA_SOURCE: ${ARTIST_REPORT_DATA_SOURCE}
      SYNC_EVENT_LOG_DIALECT: pg
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      SYNC_HMAC_ACCESS_KEY: ${SYNC_HMAC_ACCESS_KEY}
      SYNC_HMAC_SECRET: ${SYNC_HMAC_SECRET}
      SYNC_HMAC_TENANT: ${SYNC_HMAC_TENANT}
      SYNC_CMS_EVENTS_URL: http://localhost:3030/api/v1/sync/events
    depends_on:
      - db
    ports:
      - "${CMS_PORT:-3030}:3030"

  relay:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/yyc3_club_ops
      DATABASE_OWNER_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/yyc3_club_ops
      SYNC_CMS_EVENTS_URL: http://cms:3030/api/v1/sync/events
      SYNC_HMAC_ACCESS_KEY: ${SYNC_HMAC_ACCESS_KEY}
      SYNC_HMAC_SECRET: ${SYNC_HMAC_SECRET}
    depends_on:
      - db
      - cms
    entrypoint: ["/bin/sh", "-c", "while true; do tsx server/sync/relay-cli.ts || true; sleep 60; done"]

volumes:
  pgdata:
